# The deploy workflow this rebuild needs, parked here because GitHub refuses workflow-file changes
# pushed with the box's OAuth token (it lacks the `workflow` scope). Before or when merging to main,
# copy this file over .github/workflows/deploy.yml. The old workflow installs Yarn 1 and will fail
# against this repo's Yarn 4 lockfile and packageManager field.

name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Yarn 4 comes from the `packageManager` field in package.json, via Corepack.
      - run: corepack enable

      - run: yarn install --immutable

      # Build, then the gate: the tests read dist/ and fail the deploy if a page breaks a rule
      # (a price not from site.ts, a third-party request, a page over the weight budget).
      - run: yarn gate

      # GitHub Pages, from the gh-pages branch, with the custom domain carried in public/CNAME.
      # When the site moves to Cloudflare Pages this job goes away; see CLAUDE.md.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
